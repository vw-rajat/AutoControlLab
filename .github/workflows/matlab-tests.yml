name: MATLAB tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath("src")); results = runtests("tests"); assertSuccess(results)
